<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>
<title>Evangel Results</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;700&family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: class grid on home, then one class screen with five task tabs. Input cells yellow, computed cells green, as in the school's Excel sheet. */
:root{
  --bg:#f3f5f8;--surface:#ffffff;--ink:#16202e;--muted:#566377;--line:#d5dce6;
  --brand:#1c3d6e;--brand-ink:#ffffff;
  --input:#fff1a6;--input-line:#dcc13f;--auto:#d7efdd;--auto-ink:#14502b;
  --bad:#b3261e;--bad-bg:#fde5e2;--warn-bg:#fff2cf;--warn-ink:#5b4300;
  --paper:#ffffff;--paper-ink:#111111;
  --display:'Bitter',Georgia,'Times New Roman',serif;
  --body:'Public Sans',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1621;--surface:#172131;--ink:#e8edf4;--muted:#9aa8bb;--line:#2b394d;
  --brand:#7fb0f0;--brand-ink:#0b1a2e;
  --input:#4b4217;--input-line:#8a7a26;--auto:#1b3a29;--auto-ink:#a9e3bb;
  --bad:#ff9189;--bad-bg:#43211f;--warn-bg:#40361a;--warn-ink:#f1d98a;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1621;--surface:#172131;--ink:#e8edf4;--muted:#9aa8bb;--line:#2b394d;
  --brand:#7fb0f0;--brand-ink:#0b1a2e;
  --input:#4b4217;--input-line:#8a7a26;--auto:#1b3a29;--auto-ink:#a9e3bb;
  --bad:#ff9189;--bad-bg:#43211f;--warn-bg:#40361a;--warn-ink:#f1d98a;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px}
#app{max-width:780px;margin:0 auto}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.2}
h2{font-size:1.15rem}h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)}.small{font-size:.82rem}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:12px}

.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding-block:6px 14px}
.top h1{font-size:1.35rem}
.top .sub{color:var(--muted);font-size:.88rem;margin-top:2px}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:8px;padding:10px 14px;font-weight:600;min-height:42px}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 10px;min-height:34px;font-size:.88rem}
.btn.danger{background:var(--bad-bg);color:var(--bad);border:1px solid var(--bad)}
.btn[disabled]{opacity:.5;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.banner{background:var(--warn-bg);color:var(--warn-ink);border-radius:10px;padding:12px 14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.82rem;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:5px;border:1px solid var(--line)}
.sw-in{background:var(--input)}.sw-auto{background:var(--auto)}

.section-title{font-family:var(--display);font-size:.8rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.clsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cls{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0}
.cls b{font-family:var(--display);font-size:1.1rem}
.cls .bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.cls .bar i{display:block;height:100%;background:var(--auto-ink)}
.cls small{color:var(--muted)}

.backrow{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:10px 12px;font-weight:600;color:var(--muted);white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--brand)}

label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted);min-width:0}
.txt,select.txt,textarea.txt{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;color:var(--ink);font-size:16px;min-width:0}
textarea.txt{min-height:92px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}

.stu{display:grid;grid-template-columns:2rem minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
.stu:first-child{border-top:0}
.stu .n{color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;display:inline-flex;align-items:center;gap:4px;font-size:.85rem}
.chip button{background:none;border:0;color:var(--muted);padding:2px 6px;font-size:1rem;line-height:1}

.shead,.srow{display:grid;grid-template-columns:minmax(0,1fr) 62px 62px 46px 44px;gap:6px;align-items:center}
.shead{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;text-align:center;padding-bottom:6px}
.shead span:first-child{text-align:left}
.srow{padding:5px 0;border-top:1px solid var(--line)}
.srow .nm{font-size:.85rem;display:flex;gap:6px;min-width:0;word-break:break-word}
.srow .nm .n{color:var(--muted);min-width:1.4rem;text-align:right;font-variant-numeric:tabular-nums}
.sin{width:100%;padding:9px 2px;text-align:center;background:var(--input);border:1px solid var(--input-line);border-radius:6px;font-size:16px;font-variant-numeric:tabular-nums}
.sin.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.auto{background:var(--auto);color:var(--auto-ink);border-radius:6px;text-align:center;padding:9px 2px;font-weight:700;font-variant-numeric:tabular-nums;font-size:.9rem}
.progress{font-size:.85rem;color:var(--muted)}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.res{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:.85rem}
table.res th,table.res td{border:1px solid var(--line);padding:5px 7px;text-align:center;white-space:nowrap}
table.res td.l,table.res th.l{text-align:left;white-space:normal;min-width:150px}
table.res th{background:var(--bg);font-weight:600}
table.res th.vert{writing-mode:vertical-rl;transform:rotate(180deg);height:150px;padding:8px 4px;white-space:nowrap}
table.res td.a{background:var(--auto);color:var(--auto-ink);font-weight:700}
table.res td.f9{color:var(--bad);font-weight:700}
table.res tr.foot td{background:var(--bg);font-weight:600}

.notice{border-radius:8px;padding:10px 12px;font-size:.88rem;background:var(--warn-bg);color:var(--warn-ink)}
.notice.good{background:var(--auto);color:var(--auto-ink)}
.notice.bad{background:var(--bad-bg);color:var(--bad)}
.codebox{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;min-height:70px}
.empty{padding:26px 8px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(18px,env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:.88rem;max-width:90vw;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
.cardscroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg)}

/* Report card paper: fixed light colours, rounded frame like the printed school form */
.card{background:var(--paper);color:var(--paper-ink);border:3px solid #111;border-radius:36px;padding:16px 18px 18px;font-family:var(--body);font-size:12px;line-height:1.35;min-width:690px;aspect-ratio:210/297;display:flex;flex-direction:column}
.card .hd{display:grid;grid-template-columns:86px 1fr 86px;align-items:center;gap:8px;text-align:center}
.card .logo{width:82px;height:82px;border-radius:50%;object-fit:cover;display:block}
.card .logo.none{visibility:hidden}
.card .sc{font-family:var(--display);font-size:25px;font-weight:700;line-height:1.1}
.card .lg{font-size:13px;font-weight:600;margin-top:3px}
.card .mt{display:inline-block;background:#111;color:#fff;font-size:11px;font-weight:700;padding:2px 12px;margin-top:5px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.card .line{display:flex;gap:6px;align-items:flex-end;margin-top:8px;font-weight:600;white-space:nowrap}
.card .fill{flex:1;border-bottom:1.5px dotted #111;min-width:28px;padding:0 4px;font-weight:700;min-height:1.25em;overflow:hidden;text-overflow:clip}
.card .fill.w2{flex:2.4}
.card .fill.tall{white-space:normal;min-height:2.7em;margin-top:6px}
.card table{width:100%;border-collapse:collapse;table-layout:fixed}
.card th,.card td{border:1.5px solid #111;padding:2px 4px;text-align:center;font-variant-numeric:tabular-nums;overflow:hidden}
.card td.l{text-align:left}
.card .main{margin-top:8px;border:2.5px solid #111}
.card .main th{background:#fff;font-size:11px}
.card .main th.v{writing-mode:vertical-rl;transform:rotate(180deg);height:112px;padding:4px 2px;white-space:nowrap}
.card .main th.subj{font-size:18px;font-weight:800}
.card .main td{height:21px;padding:1px 4px;font-size:11.5px}
.card .main td.l{font-weight:600}
.card .main td.rm{font-size:9.5px}
.card .below{display:grid;grid-template-columns:3.1fr .5fr 1.7fr;margin-top:6px;align-items:end}
.card .chars th{font-size:11.5px;background:#fff}
.card .chars td{height:20px;font-size:11.5px;font-weight:600}
.card .gk th,.card .gk td{font-size:9.5px;padding:1px 3px;font-weight:700}
.card .gk{border:2px solid #111}
.card .foot{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;margin-top:8px}
.card .rt{font-weight:700;margin-top:8px}
.card .mainwrap{flex:1 1 auto;display:flex;flex-direction:column;margin-top:8px;min-height:0}
.card .mainwrap .main{margin-top:0;flex:1 1 auto}
.card .foot{margin-top:auto;padding-top:8px}
.pk{display:flex;gap:6px;align-items:center;cursor:pointer}.pk input{width:18px;height:18px}
#printRoot{display:none}
@media print{
  body{padding:0;background:#fff}
  #app,.toast{display:none!important}
  #printRoot{display:block!important}
  #printRoot .card{min-width:0;aspect-ratio:auto;width:194mm;height:279mm;font-size:12.5px;padding:14px 18px 16px;break-after:page;page-break-after:always;overflow:hidden}
  #printRoot .card .main td{font-size:13px}#printRoot .card .main th{font-size:12px}#printRoot .card .main td.rm{font-size:10.5px}
  #printRoot .card .chars td,#printRoot .card .chars th{font-size:12.5px}#printRoot .card .gk th,#printRoot .card .gk td{font-size:10.5px}
  #printRoot .sheetwrap{height:191mm;display:flex;flex-direction:column}
  #printRoot .sheetwrap table{flex:1 1 auto;font-size:12px!important}
  #printRoot .sheetwrap th,#printRoot .sheetwrap td{padding:3px 5px!important}
  #printRoot .card:last-child{break-after:auto;page-break-after:auto}
  #printRoot .sheetwrap table{width:100%;border-collapse:collapse;font-size:10px}
  #printRoot .sheetwrap th,#printRoot .sheetwrap td{border:1px solid #111;padding:2px 4px;text-align:center;color:#111}
  #printRoot .sheetwrap td.l{text-align:left}
  #printRoot .sheetwrap th.vert{writing-mode:vertical-rl;transform:rotate(180deg);height:140px}
  #printRoot .sheetwrap h2{color:#111;margin-bottom:6px}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>

<div id="app"></div>
<div id="printRoot"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<style id="pageStyle"></style>

<script>
//#LOGIC
var CLASSES=[['jss1a','JSS 1A'],['jss1b','JSS 1B'],['jss2a','JSS 2A'],['jss2b','JSS 2B'],['jss3a','JSS 3A'],['jss3b','JSS 3B'],['sss1a','SSS 1A'],['sss1b','SSS 1B'],['sss2a','SSS 2A'],['sss2b','SSS 2B'],['sss3','SSS 3']];
var JSS_SUBJECTS=['MATHEMATICS','ENGLISH LANGUAGE','BASIC SCIENCE','BASIC TECHNOLOGY','SOCIAL STUDIES','CIVIC EDUCATION','AGRICULTURAL SCIENCE','BUSINESS STUDIES','C.R.S','COMPUTER STUDIES','HOME ECONOMICS','CULTURAL & CREATIVE ARTS','PHYSICAL & HEALTH EDUCATION'];
var SSS1_SUBJECTS=['MATHEMATICS','ENGLISH LANGUAGE','PHYSICS','CHEMISTRY','BIOLOGY','CIVIC EDUCATION','MARKETING','GOVERNMENT','LITERATURE-IN-ENGLISH','ECONOMICS','C.R.S','HISTORY','AGRICULTURAL SCIENCE','GEOGRAPHY','FINANCIAL ACCOUNTING','FURTHER MATHEMATICS'];
var SSS2_SUBJECTS=['MATHEMATICS','ENGLISH LANGUAGE','PHYSICS','CHEMISTRY','BIOLOGY','CIVIC EDUCATION','ECONOMICS','AGRIC SCIENCE','GEOGRAPHY','FURTHER MATHEMATICS','ANIMAL HUSBANDRY'];
function defaultSubjects(id){
  if(id.indexOf('jss')===0) return JSS_SUBJECTS.slice();
  if(id==='sss1a') return SSS1_SUBJECTS.concat(['FISHERY']);
  if(id==='sss1b') return SSS1_SUBJECTS.concat(['ANIMAL HUSBANDRY']);
  return SSS2_SUBJECTS.slice();
}
var GK=[[75,'A1','DISTINCTION'],[70,'B2','VERY GOOD'],[65,'B3','GOOD'],[60,'C4','CREDIT'],[55,'C5','CREDIT'],[50,'C6','CREDIT'],[45,'D7','PASS'],[40,'E8','WEAK PASS'],[0,'F9','FAIL']];
var GK_LABELS=['0-39','40-44','45-49','50-54','55-59','60-64','65-69','70-74','75-100'];
function gradeOf(t){for(var i=0;i<GK.length;i++){if(t>=GK[i][0])return {g:GK[i][1],r:GK[i][2]}}return {g:'F9',r:'FAIL'}}
function ord(n){var s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function num(v){var n=parseFloat(v);return isNaN(n)?0:n}
function clampScore(v,max){return Math.max(0,Math.min(max,num(v)))}
function entered(v){return !!v&&(String(v[0]).trim()!==''||String(v[1]).trim()!=='')}
function totalOf(v){return entered(v)?clampScore(v[0],40)+clampScore(v[1],60):null}
function fmt(n){return Number.isInteger(n)?String(n):n.toFixed(1)}
function norm(s){return String(s).toUpperCase().replace(/\s+/g,' ').trim()}
function compute(c,t){
  var stat={};
  c.subjects.forEach(function(sub){
    var sc=t.scores[sub]||{};
    var list=[];
    c.students.forEach(function(s){var tot=totalOf(sc[s.id]);if(tot!==null)list.push({sid:s.id,t:tot})});
    var avg=list.length?list.reduce(function(a,x){return a+x.t},0)/list.length:null;
    var pos={};
    list.forEach(function(x){pos[x.sid]=1+list.filter(function(y){return y.t>x.t}).length});
    stat[sub]={n:list.length,avg:avg,pos:pos};
  });
  var active=c.subjects.filter(function(s){return stat[s].n>0});
  var rows=c.students.map(function(s){
    var sum=0,missing=0;
    active.forEach(function(sub){var tot=totalOf((t.scores[sub]||{})[s.id]);if(tot===null)missing++;else sum+=tot});
    var out=active.length*100;
    return {s:s,sum:sum,out:out,pct:out?sum/out*100:0,missing:missing};
  });
  rows.forEach(function(r){r.pos=1+rows.filter(function(q){return q.sum>r.sum}).length});
  return {active:active,stat:stat,rows:rows};
}
function enc(o){
  var b=new TextEncoder().encode(JSON.stringify(o)),s='';
  for(var i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function dec(str){
  str=str.replace(/-/g,'+').replace(/_/g,'/');
  while(str.length%4)str+='=';
  var bin=atob(str),b=new Uint8Array(bin.length);
  for(var i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);
  return JSON.parse(new TextDecoder().decode(b));
}
function cleanNames(text){
  return text.split(/\r?\n/).map(function(line){
    var cells=line.split('\t').map(function(x){return x.trim()}).filter(function(x){return x&&!/^\d+(\.0)?$/.test(x)});
    return norm(cells.join(' ').replace(/^\d+[.)]\s*/,''));
  }).filter(Boolean);
}
function suggestRemark(p){
  if(p>=75)return 'An excellent result. Keep it up.';
  if(p>=65)return 'A very good performance. Aim higher next term.';
  if(p>=55)return 'A good result. More effort will bring improvement.';
  if(p>=45)return 'A fair result. Work harder, especially in the weak subjects.';
  if(p>=40)return 'A weak pass. Serious improvement is needed.';
  return 'A poor result. Sit up and seek help in the failed subjects.';
}
//#END

    c.students.forEach(function(s){t.scores[sub][s.id]=[String(Math.round(8+rnd()*30)),String(Math.round(14+rnd()*42))]});
  });
  delete t.scores['PHYSICS']['demo8'];
  t.days='62';
  c.students.forEach(function(s,i){t.extra[s.id]={days:String(52+((i*5)%10)),char:{},remark:'',principal:''}});

}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('on')},2800)}
function autoCode(sub){var w=String(sub).replace(/[^A-Z ]/g,' ').split(' ').filter(Boolean);if(!w.length)return String(sub).slice(0,3);return w.length===1?w[0].slice(0,3):w[0].slice(0,2)+w.slice(1).map(function(x){return x[0]}).join('').slice(0,2)}
function subCode(sub){return (S.codes&&S.codes[sub])||autoCode(sub)}
function stamp(ts){try{return new Date(ts).toLocaleString('en-GB',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'})}catch(e){return ''}}
function shortSub(s){return s}
function scoredSubjects(cid){var c=S.classes[cid],t=T(cid);return c.subjects.filter(function(s){var m=t.scores[s]||{};return c.students.some(function(st){return entered(m[st.id])})}).length}
function download(name,text){
  try{var b=new Blob([text],{type:'text/plain'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);return true}catch(e){return false}
}
function copyText(text,box){
  var done=function(){toast('Copied. Paste it into WhatsApp or email.')};
  var fall=function(){if(box){box.focus();box.select();try{document.execCommand('copy');done();return}catch(e){}}toast('Press and hold the code, then choose Copy.')};
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fall);return}}catch(e){}

function classListCode(cid){

  return enc({v:1,k:'L',cid:cid,name:c.name,students:c.students,subjects:c.subjects,codes:c.subjects.reduce(function(a,x){a[x]=subCode(x);return a},{}),session:S.settings.session,term:S.settings.term,school:{school:S.settings.school,lga:S.settings.lga,motto:S.settings.motto},days:T(cid).days||''});
}
function multiCode(cid,subs,by){
  var c=S.classes[cid],t=T(cid);
  return enc({v:1,k:'M',cid:cid,name:c.name,by:by||'',session:S.settings.session,term:S.settings.term,days:t.days||'',students:c.students.map(function(x){return [x.id,x.name]}),subs:subs.map(function(sub){var sc=t.scores[sub]||{};return {n:sub,c:subCode(sub),r:c.students.map(function(x){var v=sc[x.id]||['',''];return [v[0],v[1]]})}})});
}
function scoresCode(cid,subject,by){
  var c=S.classes[cid],sc=T(cid).scores[subject]||{};
  return enc({v:1,k:'S',cid:cid,name:c.name,subject:subject,by:by||'',session:S.settings.session,term:S.settings.term,rows:c.students.map(function(s){var v=sc[s.id]||['',''];return [s.id,s.name,v[0],v[1]]})});
}
function importText(text){
  var m=String(text).match(/ECA1\.([A-Za-z0-9_-]+)/);
  if(!m)return {ok:false,msg:'No results code found. Paste the whole message you received.'};
  var o;try{o=dec(m[1])}catch(e){return {ok:false,msg:'The code is damaged. Ask the sender to send it again.'}}
  if(!o||!S.classes[o.cid])return {ok:false,msg:'This code is for a class that is not in this app.'};
  var c=S.classes[o.cid];
  if(o.k==='L'){
    c.students=(o.students||[]).map(function(s){return {id:String(s.id),name:String(s.name)}});
    if(o.subjects&&o.subjects.length)c.subjects=o.subjects.map(String);
    S.settings.session=o.session||S.settings.session;S.settings.term=o.term||S.settings.term;
    if(o.school){S.settings.school=o.school.school||S.settings.school;S.settings.lga=o.school.lga||S.settings.lga;S.settings.motto=o.school.motto||S.settings.motto}
    if(o.codes)Object.keys(o.codes).forEach(function(k){S.codes[k]=String(o.codes[k])});
    if(o.days)T(o.cid).days=String(o.days);
    save();
    return {ok:true,cid:o.cid,msg:'Class list for '+c.name+' loaded: '+c.students.length+' students, '+c.subjects.length+' subjects.'};
  }
  if(o.k==='S'){
    if(!c.students.length)(o.rows||[]).forEach(function(r){c.students.push({id:String(r[0]),name:norm(r[1])})});
    var key=o.session+'|'+o.term,b=bucket(key,o.cid);
    var byId={},byName={};
    c.students.forEach(function(s){byId[s.id]=s;byName[norm(s.name)]=s});
    var ok=0,miss=[],sc={};
    (o.rows||[]).forEach(function(r){
      var s=byId[String(r[0])]||byName[norm(r[1])];
      if(!s){miss.push(r[1]);return}
      if(String(r[2]).trim()===''&&String(r[3]).trim()==='')return;
      sc[s.id]=[String(r[2]),String(r[3])];ok++;
    });
    b.scores[o.subject]=sc;
    if(c.subjects.indexOf(o.subject)<0)c.subjects.push(o.subject);
    b.meta[o.subject]={by:o.by||'',at:Date.now(),n:ok};
    save();
    var msg=o.subject+' for '+c.name+' ('+o.term+', '+o.session+'): '+ok+' scores imported';
    if(miss.length)msg+='. '+miss.length+' name(s) did not match: '+miss.slice(0,4).join(', ');
    return {ok:true,cid:o.cid,msg:msg+'.',warn:miss.length>0};
  }
  if(o.k==='M'){
    var b2=bucket(o.session+'|'+o.term,o.cid),idx=[],added=0,i1={},n1={},fresh=!c.students.length,nsub=0,nsc=0;
    c.students.forEach(function(x){i1[x.id]=x;n1[norm(x.name)]=x});
    (o.students||[]).forEach(function(r){var x=i1[String(r[0])]||n1[norm(r[1])];if(!x){x={id:String(r[0]),name:norm(r[1])};c.students.push(x);i1[x.id]=x;n1[norm(x.name)]=x;if(!fresh)added++}idx.push(x)});
    (o.subs||[]).forEach(function(q){
      var sub=q.n;
      if(c.subjects.indexOf(sub)<0){var m2=c.subjects.filter(function(z){return subCode(z)===q.c})[0];if(m2)sub=m2;else c.subjects.push(sub)}
      var sc=b2.scores[sub]||{},k=0;
      (q.r||[]).forEach(function(v,i){var x=idx[i];if(!x||(String(v[0]).trim()===''&&String(v[1]).trim()===''))return;sc[x.id]=[String(v[0]),String(v[1])];k++});
      b2.scores[sub]=sc;b2.meta[sub]={by:o.by||'',at:Date.now(),n:k};nsub++;nsc+=k;
      if(q.c&&q.c!==autoCode(sub))S.codes[sub]=String(q.c);
    });
    if(o.days&&!b2.days)b2.days=String(o.days);
    save();
    return {ok:true,cid:o.cid,warn:added>0,msg:nsub+' subject'+(nsub===1?'':'s')+' for '+c.name+' ('+o.term+', '+o.session+'): '+nsc+' scores imported'+(fresh?'; '+idx.length+' students created from the names':'')+(added?'; '+added+' new name(s) added to the class':'')+'.'};
  }
  return {ok:false,msg:'Unknown code type.'};
}

  var heads=['C.A (40%)','EXAM (60%)','TOTAL (100%)','CLASS AVERAGE','POSITION','GRADE','REMARK','SIGNATURE'].map(function(h){return '<th class="v">'+h+'</th>'}).join('');
  return '<div class="card"><div class="hd">'+logo+'<div><div class="sc">'+esc(st.school)+'</div><div class="lg">'+esc(st.lga)+'</div><div class="mt">MOTTO '+esc(st.motto)+'</div></div><span class="logo none"></span></div>'+
   '<div class="line">'+fl('NAME:',row.s.name,'w2')+fl('TERM',st.term.toUpperCase())+fl('YEAR',st.session)+'</div>'+
   '<div class="line">'+fl('CLASS:',c.name)+fl('ATTENDANCE:',ex.days||'')+fl('DAY OUT OF:',t.days||'')+fl('PERCENTAGE:',has0?row.pct.toFixed(2):'')+fl('GRADE:',has0?gp.g:'')+'</div>'+
   '<div class="mainwrap"><table class="main">'+cols+'<thead><tr><th>S/N</th><th class="subj">SUBJECTS</th>'+heads+'</tr></thead><tbody>'+body+'</tbody></table></div>'+
   '<div class="below"><table class="chars"><thead><tr><th>CHARACTER DEVELOPMENT</th><th style="width:20%">GRADE</th><th style="width:28%">SIGNATURE</th></tr></thead><tbody>'+chars+'</tbody></table><span></span><table class="gk"><thead><tr><th>SCORES</th><th>GRADE</th><th>REMARKS</th></tr></thead><tbody>'+key+'</tbody></table></div>'+
   '<div class="foot"><div>'+
    '<div class="line">'+fl('Total Score:',has0?fmt(row.sum):'')+fl('Out Of:',has0?row.out:'')+'</div>'+
    '<div class="line">'+fl('No. In Class:',c.students.length)+fl('No. Examined:',examined)+fl('Position:',has0?ord(row.pos):'')+'</div>'+
    '<div class="line">'+fl('Outd. Debt:','')+fl('School Fees','')+fl('Total Bill','')+'</div>'+
    '<div class="line">'+fl('Next Term Begins:',st.next||'')+'</div></div>'+
   '<div><div class="rt">Teacher\'s Remark &amp; Signature</div><div class="fill tall">'+esc(ex.remark||'')+'</div>'+
    '<div class="line">'+fl('Principal\'s Comment:',ex.principal||'')+'</div><div class="fill tall"></div>'+
    '<div class="line">'+fl('Signature &amp; Date:','')+'</div></div></div></div>';
}

function shareView(){
  var c=S.classes[V.cid],t=T(V.cid),h='<div class="stack">';
  h+='<div class="panel stack"><h3>Class teacher: send the class list</h3><span class="small muted">Subject teachers load this so every name matches.</span>';
  if(!c.students.length)h+='<div class="notice">Add students in Setup first.</div>';
  else{
    var code='CLASS LIST | '+c.name+' | '+S.settings.term+' '+S.settings.session+' | '+c.students.length+' students\nECA1.'+classListCode(V.cid);
    h+='<textarea class="txt codebox" id="codeL" readonly>'+esc(code)+'</textarea><div class="row"><button class="btn" data-act="copy" data-box="codeL">Copy</button><button class="btn sec" data-act="save-file" data-box="codeL" data-name="'+c.name.replace(/\s/g,'')+'_class_list.txt">Save as file</button></div>';
  }
  h+='</div>';
  h+='<div class="panel stack"><h3>Send scores: any teacher</h3><span class="small muted">Tick the subject codes you want to send. Tick all of them to send the whole class: every name and every subject score.</span>';
  if(!c.students.length)h+='<div class="notice">Add the class names in Setup (or load the class list) first.</div>';
  else{
    V.pick=V.pick||{};
    h+='<div class="chips">'+c.subjects.map(function(s){return '<label class="chip pk" style="padding:6px 12px"><input type="checkbox" data-pick="'+esc(s)+'"'+(V.pick[s]?' checked':'')+'><b>'+esc(subCode(s))+'</b> '+esc(s)+'</label>'}).join('')+'</div>';
    h+='<div class="row"><button class="btn sec sm" data-act="pick-all">Tick all</button><button class="btn sec sm" data-act="pick-none">Clear</button></div>';
    h+='<label class="f">Your name (optional)<input class="txt" id="byName" value="'+esc(V.by||'')+'"></label><button class="btn" data-act="make-scores">Make code</button>';
    if(V.scoreCode){h+='<textarea class="txt codebox" id="codeS" readonly>'+esc(V.scoreCode)+'</textarea><div class="row"><button class="btn" data-act="copy" data-box="codeS">Copy</button><button class="btn sec" data-act="save-file" data-box="codeS" data-name="'+c.name.replace(/\s/g,'')+'_scores.txt">Save as file</button></div>'}
  }
  h+='</div>';
  h+='<div class="panel stack"><h3>Class teacher: receive subject scores</h3><textarea class="txt codebox" id="classCode" placeholder="Paste the message from the subject teacher"></textarea><div class="row"><button class="btn" data-act="import-class">Import</button><label class="btn sec" style="display:inline-flex;align-items:center">Choose a saved file<input type="file" id="fileClass" accept=".txt,text/plain" hidden></label></div>';
  if(V.msg)h+='<div class="notice '+(V.msg.ok&&!V.msg.warn?'good':(V.msg.ok?'':'bad'))+'">'+esc(V.msg.msg)+'</div>';
  h+='</div>';
  if(c.students.length){
    h+='<div class="panel stack"><h3>What has arrived</h3><div class="tblwrap"><table class="res"><thead><tr><th class="l">Subject</th><th>Scored</th><th class="l">Received from</th></tr></thead><tbody>'+c.subjects.map(function(s){
      var sc=t.scores[s]||{},n=c.students.filter(function(x){return entered(sc[x.id])}).length,m=t.meta[s];
      return '<tr><td class="l"><b>'+esc(subCode(s))+'</b> '+esc(s)+'</td><td class="a">'+n+'/'+c.students.length+'</td><td class="l">'+(m?esc((m.by?m.by+', ':'')+stamp(m.at)):'<span class="muted">typed here or not yet sent</span>')+'</td></tr>';
    }).join('')+'</tbody></table></div></div>';
  }
  return h+'</div>';
}

/* ---------- render + events ---------- */
function render(){
  $('#app').innerHTML=V.screen==='home'?homeView():classView();
  if(V.screen==='class'&&V.tab==='scores')updateProgress();
}
function printHTML(html,orient){
  $('#printRoot').innerHTML=html;
  $('#pageStyle').textContent='@page{size:A4 '+orient+';margin:8mm}';
  try{window.print()}catch(e){}
  toast('If no print window opened, open this app in your browser or from the saved file.');
}
function afterImport(res,from){
  V.msg=res;
  if(res.ok&&from==='home'){V.screen='class';V.cid=res.cid;V.tab=res.msg.indexOf('Class list')===0?'scores':'results'}
  render();
}
function loadLogo(inp){
  var f=inp.files&&inp.files[0];if(!f)return;
  var fr=new FileReader();
  fr.onload=function(){var im=new Image();im.onload=function(){var k=Math.min(1,200/Math.max(im.width,im.height)),cv=document.createElement('canvas');cv.width=Math.round(im.width*k);cv.height=Math.round(im.height*k);cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);S.settings.logo=cv.toDataURL('image/png');save();render();toast('Logo saved.')};im.src=String(fr.result)};
  fr.readAsDataURL(f);
}
function readFile(inp,from){
  var f=inp.files&&inp.files[0];if(!f)return;
  var fr=new FileReader();fr.onload=function(){afterImport(importText(String(fr.result)),from)};fr.readAsText(f);
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  if(b.dataset.arm&&!b.dataset.armed){
    b.dataset.armed='1';b.dataset.orig=b.textContent;b.textContent='Tap again to confirm';
    setTimeout(function(){if(b.isConnected){delete b.dataset.armed;b.textContent=b.dataset.orig}},3000);return;
  }
  var a=b.dataset.act,c=V.cid?S.classes[V.cid]:null;
  if(a==='open'){V.screen='class';V.cid=b.dataset.cid;V.tab=S.classes[V.cid].students.length?'scores':'setup';V.subject=null;V.sid=null;V.msg=null;V.scoreCode=null;V.pick={};render();window.scrollTo(0,0)}
  else if(a==='home'){V.screen='home';V.msg=null;render()}
  else if(a==='tab'){V.tab=b.dataset.tab;V.msg=null;render()}
  else if(a==='toggle-settings'){V.settings=!V.settings;render()}
  else if(a==='remove-logo'){S.settings.logo='none';save();render()}
  else if(a==='default-logo'){delete S.settings.logo;save();render()}
  else if(a==='clear-sample'){var s2=S.classes.sss2a;s2.students=[];Object.keys(S.terms).forEach(function(k){delete S.terms[k].sss2a});S.sample=false;save();render()}
  else if(a==='reset'){try{localStorage.removeItem(KEY)}catch(x){}S=seed();S.sample=false;S.classes.sss2a.students=[];S.terms={};V={screen:'home'};save();render()}
  else if(a==='add-names'){var names=cleanNames($('#newNames').value),have={};c.students.forEach(function(s){have[norm(s.name)]=1});var n=0;names.forEach(function(nm){if(!have[nm]){c.students.push({id:Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3),name:nm});have[nm]=1;n++}});save();render();toast(n+' student'+(n===1?'':'s')+' added.')}
  else if(a==='sort-students'){c.students.sort(function(x,y){return x.name.localeCompare(y.name)});save();render()}
  else if(a==='del-student'){c.students=c.students.filter(function(s){return s.id!==b.dataset.sid});save();render()}
  else if(a==='add-subject'){var v=norm($('#newSub').value);if(v&&c.subjects.indexOf(v)<0){c.subjects.push(v);save();render()}}
  else if(a==='del-subject'){var nm2=c.subjects[+b.dataset.i];c.subjects.splice(+b.dataset.i,1);Object.keys(S.terms).forEach(function(k){if(S.terms[k][V.cid])delete S.terms[k][V.cid].scores[nm2]});save();render()}
  else if(a==='prev'||a==='next'){var i=c.students.findIndex(function(s){return s.id===V.sid});i=(i+(a==='next'?1:-1)+c.students.length)%c.students.length;V.sid=c.students[i].id;render()}
  else if(a==='suggest'){var r=compute(c,T(V.cid)),row=r.rows.filter(function(x){return x.s.id===V.sid})[0],t=T(V.cid);t.extra[V.sid]=t.extra[V.sid]||{};t.extra[V.sid].remark=suggestRemark(row.pct);save();render()}
  else if(a==='print-card'){printHTML(cardHTML(V.cid,V.sid),'portrait')}
  else if(a==='print-all'){printHTML(c.students.map(function(s){return cardHTML(V.cid,s.id)}).join(''),'portrait')}
  else if(a==='print-sheet'){var t2=T(V.cid),r2=compute(c,t2);printHTML('<div class="sheetwrap"><h2>'+esc(S.settings.school)+' '+esc(c.name)+' &middot; '+esc(S.settings.term)+' '+esc(S.settings.session)+'</h2>'+sheetTable(c,t2,r2)+'</div>','landscape')}
  else if(a==='make-scores'){V.by=($('#byName').value||'').trim();var ps=c.subjects.filter(function(x){return V.pick&&V.pick[x]});if(!ps.length){toast('Tick at least one subject.');return}V.scoreCode='SCORES | '+c.name+' | '+ps.map(subCode).join(', ')+' | '+S.settings.term+' '+S.settings.session+(V.by?' | '+V.by:'')+'\nECA1.'+multiCode(V.cid,ps,V.by);render()}
  else if(a==='pick-all'||a==='pick-none'){V.by=($('#byName')||{value:V.by}).value;V.pick={};if(a==='pick-all')c.subjects.forEach(function(x){V.pick[x]=true});V.scoreCode=null;render()}
  else if(a==='copy'){var box=$('#'+b.dataset.box);copyText(box.value,box)}
  else if(a==='save-file'){var bx=$('#'+b.dataset.box);if(!download(b.dataset.name,bx.value))copyText(bx.value,bx);else toast('Saved. If nothing downloaded, use Copy instead.')}
  else if(a==='import-home'){var tx=$('#homeCode').value;afterImport(importText(tx),'home')}
  else if(a==='import-class'){afterImport(importText($('#classCode').value),'class')}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.classList.contains('sin')){
    var row=el.closest('.srow');el.value=el.value.replace(/[^0-9.]/g,'');
    var ins=row.querySelectorAll('.sin'),ca=ins[0].value.trim(),ex=ins[1].value.trim(),t=T(V.cid);
    if(!t.scores[V.subject])t.scores[V.subject]={};
    if(ca===''&&ex==='')delete t.scores[V.subject][row.dataset.sid];else t.scores[V.subject][row.dataset.sid]=[ca,ex];
    ins[0].classList.toggle('bad',num(ca)>40);ins[1].classList.toggle('bad',num(ex)>60);
    var tot=totalOf([ca,ex]);row.querySelector('[data-r="t"]').textContent=tot===null?'':fmt(tot);row.querySelector('[data-r="g"]').textContent=tot===null?'':gradeOf(tot).g;
    save();updateProgress();
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='subjSel'){V.subject=el.value;render()}
  
  else if(el.id==='stuSel'){V.sid=el.value;render()}
  else if(el.dataset.set){S.settings[el.dataset.set]=el.value.trim();save();render()}
  else if(el.dataset.stu){var s=S.classes[V.cid].students.filter(function(x){return x.id===el.dataset.stu})[0];if(s&&norm(el.value)){s.name=norm(el.value);save()}}
  else if(el.dataset.days){T(V.cid).days=el.value.trim();save();render()}
  else if(el.dataset.ex){var t=T(V.cid);t.extra[V.sid]=t.extra[V.sid]||{};t.extra[V.sid][el.dataset.ex]=el.value.trim();save();render()}
  else if(el.dataset.char){var t3=T(V.cid);t3.extra[V.sid]=t3.extra[V.sid]||{};t3.extra[V.sid].char=t3.extra[V.sid].char||{};t3.extra[V.sid].char[el.dataset.char]=el.value;save();render()}
  else if(el.dataset.pick!==undefined){V.by=($('#byName')||{value:V.by}).value;V.pick[el.dataset.pick]=el.checked;V.scoreCode=null;render()}
  else if(el.dataset.subcode!==undefined){var cv=norm(el.value).replace(/[^A-Z0-9]/g,'').slice(0,6);if(cv)S.codes[el.dataset.subcode]=cv;else delete S.codes[el.dataset.subcode];save();render()}
  else if(el.id==='logoFile')loadLogo(el);
  else if(el.id==='fileHome')readFile(el,'home');
  else if(el.id==='fileClass')readFile(el,'class');
  else if(el.classList.contains('sin')){var n=el.dataset.f==='0'?40:60;if(num(el.value)>n){el.value=String(n);el.dispatchEvent(new Event('input',{bubbles:true}))}}
});
document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('sin')){
    e.preventDefault();var all=[].slice.call(document.querySelectorAll('.sin')),i=all.indexOf(e.target);
    if(all[i+1])all[i+1].focus();
  }
});

if(typeof document!=='undefined'&&document.getElementById('app')){S=load();save();render()}
</script>
